name: Publish template image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DH_REGISTRY: docker.io
  DH_IMAGE: nikbucher/sbx-opencode2

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so change detection can diff against the pushed-to
          # or PR-base commit; the repo is small, so this is cheap.
          fetch-depth: 0

      # Skip the image build when nothing build-relevant changed, but keep
      # the job green: `build-and-push` is a required check on main, so a
      # skipped build must still report success. Keep the pattern in sync
      # with build inputs: the Dockerfile copies nothing from the context
      # except itself (see .dockerignore), so besides Dockerfile and
      # .dockerignore only this workflow can change the image.
      - name: Detect build-relevant changes
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          pattern='^(Dockerfile|\.dockerignore|\.github/workflows/publish\.yml)$'

          base=''
          comparison=''
          case "${GITHUB_EVENT_NAME}" in
            workflow_dispatch)
              echo 'Manual run: building unconditionally.'
              ;;
            pull_request)
              base="${BASE_SHA}"
              comparison="${base}...HEAD"
              ;;
            push)
              if printf '%s' "${BEFORE}" | grep -q '^0*$'; then
                echo 'Push with no previous commit (new branch): building unconditionally.'
              else
                base="${BEFORE}"
                comparison="${base}..${AFTER}"
              fi
              ;;
          esac

          build=true
          if [ -n "${base}" ]; then
            if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              echo "Base commit ${base} not found locally: building unconditionally."
            else
              # Keep diff outside the condition: errors must fail the step,
              # never turn into a successful skip.
              changed_files=$(git diff --name-only "${comparison}")
              if printf '%s\n' "${changed_files}" | grep -Eq "${pattern}"; then
                echo 'Build-relevant files changed: building.'
              else
                build=false
                {
                  echo '### Image build skipped'
                  echo ''
                  echo 'No build-relevant files changed (`Dockerfile`, `.dockerignore`, `.github/workflows/publish.yml`).'
                } >> "${GITHUB_STEP_SUMMARY}"
              fi
            fi
          fi

          echo "build=${build}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        if: steps.changes.outputs.build == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        if: steps.changes.outputs.build == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to the Container registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.changes.outputs.build == 'true'
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.changes.outputs.build == 'true'
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.DH_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Smoke test: build the amd64 image and verify the pinned OpenCode
      # version runs before anything is published.
      - name: Build amd64 image for smoke test
        if: steps.changes.outputs.build == 'true'
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: sbx-opencode2:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (opencode --version)
        if: steps.changes.outputs.build == 'true'
        run: |
          EXPECTED=$(sed -n 's/^ARG OPENCODE_VERSION=//p' Dockerfile)
          ACTUAL=$(docker run --rm sbx-opencode2:smoke opencode --version)
          echo "expected=v${EXPECTED} actual=${ACTUAL}"
          echo "${ACTUAL}" | grep -q "v${EXPECTED}"

      # The npm prefix is agent-owned in the base image; installing as root
      # would leave the package root-owned and break in-sandbox self-updates.
      - name: Smoke test (package writable by agent)
        if: steps.changes.outputs.build == 'true'
        run: docker run --rm sbx-opencode2:smoke sh -c 'test -w "$NPM_CONFIG_PREFIX/lib/node_modules/@opencode/cli"'

      # Tag published images with the pinned OpenCode version, so an
      # automerged Renovate bump releases itself without a manual git tag.
      - name: Read OpenCode version from Dockerfile
        if: steps.changes.outputs.build == 'true'
        id: version
        run: echo "version=$(sed -n 's/^ARG OPENCODE_VERSION=//p' Dockerfile)" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels)
        if: steps.changes.outputs.build == 'true'
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.DH_REGISTRY }}/${{ env.DH_IMAGE }}
          # Only the pinned OpenCode version and `latest`. No sha-/branch/
          # pr- tags: they flood the GHCR version list and old ones are a
          # chore to clean up. Traceability is kept via the git commit,
          # the workflow run and the image digest.
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        if: steps.changes.outputs.build == 'true'
        id: push
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation (GHCR)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.changes.outputs.build == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Generate artifact attestation (Docker Hub)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.changes.outputs.build == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.DH_REGISTRY }}/${{ env.DH_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
